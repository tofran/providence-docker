# Development stack for the CollectiveAccess Providence Docker image.
# Project, documentation and issues: https://github.com/tofran/providence-docker
#
# WARNING: this file is for developing and testing the image itself. It builds the image from the
# local Dockerfile, uses hard-coded throwaway passwords and exposes the database port.
# Do not use it in production: start from docker-compose-production.yaml instead.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080 (on a fresh database, run the installer at /install/)
#
# All persistent data lives under ./volumes/ (git-ignored). Delete it to start from scratch.

services:
  db:
    image: mariadb:11.8
    ports:
      # Exposed so you can inspect the database from the host with any MySQL client.
      - 3306:3306
    environment:
      - MARIADB_ROOT_PASSWORD=password
      - MARIADB_DATABASE=providence-test-db
      - MARIADB_USER=providence-user
      - MARIADB_PASSWORD=password
      # Upgrade data directories created by an older MariaDB (e.g. 10.x) on start.
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./volumes/db:/var/lib/mysql
    networks:
      - providence
    healthcheck:
      test: 'mariadb-admin --password="$$MARIADB_ROOT_PASSWORD" --silent ping'
      interval: 5s
      timeout: 5s
      retries: 4

  providence:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:80
    environment:
      # Create the database, user and grants on every start (idempotent). Needs DB_ROOT_PASSWORD.
      - INIT_DB=true
      - DB_ROOT_PASSWORD=password
      # Chowning the whole installation is slow; not needed with the local bind mounts.
      - ENSURE_PERMISSIONS=false
      # Every CA_* variable maps to the matching __CA_*__ constant of Providence's setup.php
      # (see providence-setup.php and Providence's setup.php-dist for the full list).
      - CA_DB_HOST=db
      - CA_DB_DATABASE=providence-test-db
      - CA_DB_USER=providence-user
      - CA_DB_PASSWORD=password
      - CA_DB_TYPE=mysqli
      - CA_OUT_OF_PROCESS_SEARCH_INDEXING_PORT=80
      - CA_OUT_OF_PROCESS_SEARCH_INDEXING_PROTOCOL=tcp
      - CA_OUT_OF_PROCESS_SEARCH_INDEXING_HOSTNAME=localhost
      # Show PHP errors in the browser.
      - CA_DEBUG=true
    volumes:
      # Mounted from the repository so changes apply on restart, without rebuilding the image:
      - ./entrypoint.sh:/entrypoint.sh
      - ./providence-setup.php:/var/www/setup.php
      # Persistent data, the same directories a production deployment must keep.
      # An empty config directory is filled with Providence's default configuration on start.
      - ./volumes/providence-config:/var/www/app/conf
      - ./volumes/media:/var/www/media
    networks:
      - providence

networks:
  providence:
